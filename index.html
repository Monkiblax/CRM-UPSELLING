<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Pipeline de Upsell</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png"></head><body>

<style>
/* Sticky header (title + view toggle + stage pills + search) above either a paginated card list or a draggable Kanban board */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --fg:#15202B; --fg-muted:#5B6B78; --border:#DCE3E8;
  --accent:#2A5BD7; --accent-fg:#FFFFFF; --overlay:rgba(15,23,32,.46);
  --stage-lead:#64748B; --stage-lead-asig:#3B6FD9; --stage-appt:#0891B2; --stage-cx:#7C3AED; --stage-pitch:#C2770D; --stage-followup:#C2410C; --stage-invoice:#0E7C66; --stage-pagado:#15803D; --stage-suscripcion:#0D9488; --danger:#C2410C;
  --font-display:'Archivo',system-ui,sans-serif; --font-body:'Work Sans',system-ui,sans-serif; --font-data:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1720; --surface:#172230; --fg:#E7EEF2; --fg-muted:#9FB0BC; --border:#293845; --overlay:rgba(5,9,13,.6);
    --accent:#6B96F7; --accent-fg:#0F1720;
    --stage-lead:#93A1AE; --stage-lead-asig:#7CA4F2; --stage-appt:#22D3EE; --stage-cx:#B794F6; --stage-pitch:#E3A23D; --stage-followup:#E2693D; --stage-invoice:#35B892; --stage-pagado:#4ADE80; --stage-suscripcion:#2DD4BF; --danger:#E2693D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#172230; --fg:#E7EEF2; --fg-muted:#9FB0BC; --border:#293845; --overlay:rgba(5,9,13,.6);
  --accent:#6B96F7; --accent-fg:#0F1720;
  --stage-lead:#93A1AE; --stage-lead-asig:#7CA4F2; --stage-appt:#22D3EE; --stage-cx:#B794F6; --stage-pitch:#E3A23D; --stage-followup:#E2693D; --stage-invoice:#35B892; --stage-pagado:#4ADE80; --stage-suscripcion:#2DD4BF; --danger:#E2693D;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-top:18px;padding-bottom:12px;z-index:5;border-bottom:1px solid var(--border)}
.titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:800;font-size:1.5rem;margin:0 0 2px;letter-spacing:-0.01em;text-wrap:balance}
.sub{color:var(--fg-muted);font-size:.85rem;margin:0 0 14px}
.newbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:var(--font-body);white-space:nowrap}
.newbtn:hover{opacity:.92}
.viewtoggle{display:inline-flex;border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px;background:var(--surface);margin-bottom:10px}
.viewtoggle button{border:none;background:transparent;color:var(--fg-muted);font-family:var(--font-body);font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.viewtoggle button.active{background:var(--accent);color:var(--accent-fg)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:var(--font-body);color:var(--fg);transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--accent)}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill .n{font-family:var(--font-data);color:var(--fg-muted);font-size:.78rem}
.pill.active{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--surface))}
.pill.active .n{color:var(--fg)}
.pill.all.active{background:var(--accent);color:var(--accent-fg)}
.pill.all.active .n{color:var(--accent-fg)}
.toolbar{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-family:var(--font-body);font-size:.9rem}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--fg-muted)}
.sortbtn{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 12px;font-size:.82rem;font-family:var(--font-body);cursor:pointer;white-space:nowrap}
.sortbtn:hover{border-color:var(--accent)}
.progfilter{position:relative}
.progpanel{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:20;min-width:230px;max-height:300px;overflow-y:auto}
.progpanel[hidden]{display:none}
.progitem{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.progitem input{margin:0;flex:none}
.progpanel .clearrow{display:flex;justify-content:flex-end;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.progpanel .clearrow button{border:none;background:none;color:var(--accent);font-size:.78rem;cursor:pointer;font-family:var(--font-body)}
.readonly-banner{background:color-mix(in srgb, var(--stage-pitch) 14%, var(--surface));border:1px solid var(--stage-pitch);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:.82rem;margin-top:10px}

/* list view */
#listView{padding-top:14px;padding-bottom:40px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.card .nombre{font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;cursor:pointer}
.card .nombre:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.card .importe{font-family:var(--font-data);font-weight:600;font-size:.98rem;flex:none;font-variant-numeric:tabular-nums}
.card .contact{color:var(--fg-muted);font-size:.8rem;font-family:var(--font-data);display:flex;gap:14px;flex-wrap:wrap}
.card .contact span{white-space:nowrap}
.card .row3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stagepick{appearance:none;border:1px solid var(--border);border-radius:8px;padding:5px 9px 5px 22px;font-size:.78rem;font-family:var(--font-body);font-weight:500;background:var(--surface) no-repeat left 7px center/8px 8px;cursor:pointer;color:var(--fg)}
.stagepick:disabled{opacity:.6;cursor:default}
.notas{flex:1;min-width:120px;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-size:.82rem;font-family:var(--font-body);color:var(--fg)}
.notas:hover,.notas:focus{border-color:var(--border);background:var(--bg)}
.notas:disabled{color:var(--fg-muted)}
.notas::placeholder{color:var(--fg-muted)}
.fecha{color:var(--fg-muted);font-size:.76rem;font-family:var(--font-data)}
.empty{text-align:center;color:var(--fg-muted);padding:60px 20px;font-size:.9rem}
.loadmore{display:block;margin:10px auto 0;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 18px;font-size:.85rem;cursor:pointer;font-family:var(--font-body)}
.loadmore:hover{border-color:var(--accent)}
.count{color:var(--fg-muted);font-size:.78rem;padding:0 2px 2px}
@media (max-width:620px){ .toolbar{flex-wrap:wrap} .toolbar .search{flex-basis:100%} }
@media (max-width:460px){ .card .contact{flex-direction:column;gap:2px} }

/* kanban view */
#kanbanView{display:none;padding-top:14px;padding-bottom:30px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 268px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col.dragover{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent) inset}
.col-head{padding:12px 12px 10px;border-bottom:1px solid var(--border);flex:none}
.col-head .label{display:flex;align-items:center;gap:7px;font-weight:700;font-size:.86rem}
.col-head .dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-head .meta{color:var(--fg-muted);font-size:.76rem;font-family:var(--font-data);margin-top:3px}
.col-cards{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcard{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:5px;min-width:0}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .kname{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.kcard .kname:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.kcard .kimporte{font-family:var(--font-data);font-size:.82rem;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.col-loadmore{margin:2px 10px 10px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px;font-size:.76rem;cursor:pointer;font-family:var(--font-body)}

/* modal shell */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;z-index:50}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.small{max-width:420px}
.modal .close{position:absolute;top:14px;right:14px;border:none;background:transparent;color:var(--fg-muted);font-size:1.3rem;cursor:pointer;line-height:1;padding:4px}
.modal .close:hover{color:var(--fg)}
.modal h2{font-family:var(--font-display);font-size:1.25rem;margin:0 0 8px;padding-right:28px;text-wrap:balance}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:.72rem;color:var(--fg-muted)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:20px}
.field label{display:block;font-size:.68rem;font-weight:600;letter-spacing:.04em;color:var(--fg-muted);text-transform:uppercase;margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font-family:var(--font-body);font-size:.88rem}
.field input:disabled,.field select:disabled{opacity:.65}
@media (max-width:460px){ .fieldgrid{grid-template-columns:1fr} }
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.sectionhead h3{font-size:.86rem;margin:0;font-weight:700}
.proggrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:18px}
.progitem2{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:3px 0;cursor:pointer}
.progitem2 input{margin:0;flex:none}
.progitem2.dis{opacity:.6;cursor:default}
@media (max-width:460px){ .proggrid{grid-template-columns:1fr} }
.smallbtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:5px 10px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.smallbtn:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.ophint{color:var(--fg-muted);font-size:.78rem;margin:-4px 0 8px}
.oprow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:7px;font-size:.84rem}
.oprow .opname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oprow .opright{display:flex;align-items:center;gap:8px;flex:none}
.opdel{border:none;background:transparent;color:var(--fg-muted);font-size:1.05rem;line-height:1;cursor:pointer;padding:0 0 0 2px;flex:none}
.opdel:hover{color:var(--danger)}
.pillstate{border-radius:999px;padding:2px 9px;font-size:.7rem;font-weight:600}
.pillstate.pagado{background:color-mix(in srgb, var(--stage-invoice) 18%, transparent);color:var(--stage-invoice)}
.pillstate.pendiente{background:color-mix(in srgb, var(--stage-pitch) 18%, transparent);color:var(--stage-pitch)}
.pillstate.proceso{background:color-mix(in srgb, var(--stage-lead) 18%, transparent);color:var(--stage-lead)}
.pillstate.cancelado{background:color-mix(in srgb, var(--danger) 18%, transparent);color:var(--danger)}
.opdate{color:var(--fg-muted);font-family:var(--font-data);font-size:.76rem}
.newopform{border:1px dashed var(--border);border-radius:9px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.newopform .row{display:flex;gap:8px;flex-wrap:wrap}
.newopform input,.newopform select{flex:1;min-width:90px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:7px;padding:6px 8px;font-size:.82rem;font-family:var(--font-body)}
.newopform .actions{display:flex;gap:8px;justify-content:flex-end}
.histhint{color:var(--fg-muted);font-size:.78rem;margin:-4px 0 10px}
.notebox{width:100%;min-height:72px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:9px 11px;font-size:.85rem;font-family:var(--font-body);resize:vertical;margin-bottom:16px;box-sizing:border-box}
.notebox:disabled{opacity:.65;resize:none}
.notebox::placeholder{color:var(--fg-muted)}
.histlist{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;padding-right:2px}
.histitem{display:flex;gap:9px;font-size:.82rem}
.histitem .hicon{flex:none;width:20px;text-align:center}
.histitem .htext{min-width:0}
.histitem .hdate{color:var(--fg-muted);font-size:.72rem;font-family:var(--font-data);margin-right:6px}
.histitem.auto{color:var(--fg-muted)}
.deletewrap{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dellink{color:var(--danger);background:none;border:none;font-size:.82rem;cursor:pointer;font-family:var(--font-body);padding:0}
.dellink:hover{text-decoration:underline}
.confirmrow{display:flex;align-items:center;gap:8px;font-size:.82rem}
.confirmrow button{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:7px;padding:5px 10px;font-size:.8rem;cursor:pointer;font-family:var(--font-body)}
.confirmrow button.danger{border-color:var(--danger);color:var(--danger)}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.primarybtn{border:none;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.ghostbtn{border:1px solid var(--border);background:transparent;color:var(--fg);border-radius:8px;padding:8px 16px;font-size:.85rem;cursor:pointer;font-family:var(--font-body)}
</style>

<style>
/* ---------- Rediseño: barra lateral + contenido a pantalla completa ---------- */
html,body{height:100%}
body{padding-inline:0;overflow:hidden}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:6px}
.brand img{border-radius:9px;flex:none}
.brandtxt{min-width:0}
.brand h1{font-size:1.02rem;margin:0;line-height:1.2}
.brand .sub{margin:2px 0 0;font-size:.74rem;line-height:1.3}

<script>
(function(){
  const b = document.body, mq = window.matchMedia('(max-width:900px)');
  const KEY = 'crmSideCollapsed';
  try{ if(!mq.matches && localStorage.getItem(KEY) === '1') b.classList.add('side-collapsed'); }catch(e){}
  const toggleSide = () => {
    if(mq.matches){ b.classList.toggle('menu-open'); return; }
    const c = b.classList.toggle('side-collapsed');
    try{ localStorage.setItem(KEY, c ? '1' : '0'); }catch(e){}
  };
  document.getElementById('menuBtn').addEventListener('click', toggleSide);
  document.getElementById('sideCollapse').addEventListener('click', toggleSide);
  // aviso breve (lo usa el cambio de etapa desde la ficha)
  const t = document.createElement('div'); t.className = 'toast'; t.id = 'toast'; document.body.appendChild(t);
  let tt = null;
  window.showToast = msg => { t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); };
  document.getElementById('scrim').addEventListener('click', () => b.classList.remove('menu-open'));
  document.getElementById('side').addEventListener('click', e => { if(e.target.closest('.navbtn')) b.classList.remove('menu-open'); });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ---------- Capa de datos: Supabase (reemplaza la base de datos del artifact) ---------- */
(function(){
  const cfg = window.APP_CONFIG || {};
  const $ = id => document.getElementById(id);
  if(cfg.SUBTITLE) $('subText').textContent = cfg.SUBTITLE;
  const notice = t => { $('authNotice').textContent = t || ''; };
  if(!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY){
    notice('Falta configurar Supabase (revisa config.js).');
    return;
  }
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const MAP = {fechaCierre:'fecha_cierre', contactoDesde:'contacto_desde', montoPagado:'monto_pagado', tipoPago:'tipo_pago', fechaPago:'fecha_pago', order:'ord'};
  const REV = Object.fromEntries(Object.entries(MAP).map(([k,v])=>[v,k]));
  const toRow = obj => { const r = {}; for(const [k,v] of Object.entries(obj)){ if(v !== undefined) r[MAP[k]||k] = v; } return r; };
  const toFields = row => { const d = {}; for(const [k,v] of Object.entries(row)){ if(k==='id'||k==='created_at'||v===null) continue; d[REV[k]||k] = v; } return d; };

  let role = null, entered = false, lastWrite = 0;
  const reloaders = [];
  let readyResolve; const ready = new Promise(r => { readyResolve = r; });

  function showAuth(msg, locked){
    $('authOverlay').hidden = false;
    if(msg !== undefined) notice(msg);
    $('authOut').hidden = !locked;
  }
  async function enter(session){
    if(entered) return;
    if(!session){ showAuth('', false); return; }
    const {data, error} = await sb.rpc('app_role');
    role = error ? null : data;
    if(!role){
      showAuth('Tu correo no está autorizado todavía o aún no lo confirmaste. Pídele al administrador que te agregue y confirma el correo que te llegó.', true);
      return;
    }
    entered = true;
    const em = document.getElementById('userEmail'), rl = document.getElementById('userRole');
    if(em) em.textContent = (session.user && session.user.email) || '';
    if(rl) rl.textContent = role === 'editor' ? 'Editor' : 'Solo lectura';
    $('authOverlay').hidden = true;
    readyResolve();
  }

  async function signIn(){
    notice('Entrando…');
    const {error} = await sb.auth.signInWithPassword({email: $('authEmail').value.trim(), password: $('authPass').value});
    if(error){
      notice(/confirm/i.test(error.message) ? 'Confirma tu correo primero (revisa tu bandeja de entrada).' : 'Correo o contraseña incorrectos.');
      return;
    }
    const {data} = await sb.auth.getSession();
    enter(data.session);
  }
  async function signUp(){
    const email = $('authEmail').value.trim(), password = $('authPass').value;
    if(!email || password.length < 6){ notice('Escribe tu correo y una contraseña de al menos 6 caracteres.'); return; }
    notice('Creando cuenta…');
    const {error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin}});
    notice(error ? error.message : 'Te enviamos un correo para confirmar. Ábrelo, confirma y vuelve aquí para entrar.');
  }
  $('authSignIn').addEventListener('click', signIn);
  $('authSignUp').addEventListener('click', signUp);
  ['authEmail','authPass'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') signIn(); }));
  const logout = async e => { if(e) e.preventDefault(); await sb.auth.signOut(); location.reload(); };
  $('logoutLink').addEventListener('click', logout);
  $('authOutLink').addEventListener('click', logout);
  sb.auth.getSession().then(({data}) => enter(data.session));

  function makeCollection(name){
    return {
      onSnapshot(cb, errCb){
        let stopped = false, timer = null;
        async function load(){
          try{
            let all = [], from = 0;
            const step = 1000;
            for(;;){
              const {data, error} = await sb.from(name).select('*').order('ord', {ascending:true, nullsFirst:false}).order('id').range(from, from + step - 1);
              if(error) throw error;
              all = all.concat(data);
              if(data.length < step) break;
              from += step;
            }
            if(!stopped) cb({docs: all.map(r => ({id: r.id, data: () => toFields(r)}))});
          }catch(e){ if(errCb) errCb(e); }
        }
        load();
        reloaders.push(load);
        const ch = sb.channel('rt-' + name).on('postgres_changes', {event:'*', schema:'public', table:name}, () => {
          if(Date.now() - lastWrite < 1500) return;
          clearTimeout(timer); timer = setTimeout(load, 400);
        }).subscribe();
        return () => { stopped = true; sb.removeChannel(ch); };
      },
      async add(data){
        lastWrite = Date.now();
        const {data: row, error} = await sb.from(name).insert(toRow(data)).select('id').single();
        if(error) throw error;
        return {id: row.id};
      },
      async addMany(list){
        lastWrite = Date.now();
        for(let i = 0; i < list.length; i += 500){
          const {error} = await sb.from(name).insert(list.slice(i, i + 500).map(toRow));
          if(error) throw error;
        }
        lastWrite = 0;
        reloaders.forEach(f => f());
      },
      doc(id){
        return {
          async update(obj){
            lastWrite = Date.now();
            const {error} = await sb.from(name).update(toRow(obj)).eq('id', id);
            if(error) throw error;
          },
          async delete(){
            lastWrite = Date.now();
            const {error} = await sb.from(name).delete().eq('id', id);
            if(error) throw error;
          }
        };
      }
    };
  }
  const db = { collection: makeCollection };
  window.__sb = sb;
  window.__reloadClients = () => reloaders.forEach(f => f());
  let bootHook = null;
  window.claude = {
    use: async (name) => {
      await ready;
      if(!bootHook) bootHook = (async () => { try{ if(window.__beforeBoot) await window.__beforeBoot(); }catch(e){} })();
      await bootHook;
      if(name === 'db') return db;
      if(name === 'user') return { can: () => role === 'editor' };
      return null;
    }
  };
})();
</script>

<script>
const STAGES = [
  {id:'lead', label:'Lead', hint:'Aún sin contactar', color:'var(--stage-lead)'},
  {id:'lead_asignados', label:'Lead asignados', hint:'Asignado para trabajar', color:'var(--stage-lead-asig)'},
  {id:'appointment', label:'Appointment', hint:'Cita agendada', color:'var(--stage-appt)'},
  {id:'cx_followup', label:'Preparación', hint:'Seguimiento de experiencia', color:'var(--stage-cx)'},
  {id:'followup', label:'Propuesta', hint:'En negociación', color:'var(--stage-followup)'},
  {id:'pitch', label:'Negociación', hint:'Ya se le presentó', color:'var(--stage-pitch)'},
  {id:'invoice', label:'Invoice', hint:'Factura abierta', color:'var(--stage-invoice)'},
  {id:'pagado', label:'Pagado', hint:'Pago recibido', color:'var(--stage-pagado)'},
  {id:'suscripcion', label:'Suscripción', hint:'Cliente en suscripción activa', color:'var(--stage-suscripcion)'},
  {id:'lost', label:'LOST', hint:'Oportunidad perdida', color:'#E5484D'}
];
const STAGE_BY_ID = Object.fromEntries(STAGES.map(s=>[s.id,s]));
const ESTADOS_OP = ['En proceso','Pendiente','Pagado','Cancelado'];
let CALENDLY_URL = (window.APP_CONFIG && window.APP_CONFIG.CALENDLY_URL) || 'https://calendly.com/miguel-abacus/sesion-de-dudas-e-inquietudes';
const PROGRAMAS = ['Abacus Experience','PRO','Bundle','Bundle premium','Portfolio Hacking','Options Pocket','PMC','CPA New York','CPA Miami','Traders Club','Dynamic','Inner Circle','1 a 1'];
const CLASIFICACIONES = ['Cursando / Invierte','Cursando / No Invierte','Finalizado / Invierte','Finalizado / No Invierte','Finalizado / Inactivo','No Completó','Pausado','Abandonó'];
const SIN_CLASIFICAR = 'Sin clasificar';

let allDocs = [];
let canWrite = null;
let activeStage = 'all';
let programFilter = [];
let clasifFilter = [];
let searchTerm = '';
let sortDir = 'desc';
let visibleCount = 100;
let viewMode = 'list';
let colVisible = {};
let dbNs = null, userNs = null;
let openDocId = null;
const PAGE = 100;
const COL_PAGE = 60;

function money(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  if(!iso) return '';
  try{ const d = new Date(iso); if(isNaN(d)) return iso; return d.toLocaleDateString('es-DO',{day:'2-digit',month:'short'}); }catch(e){ return iso; }
}
function resolvedColor(varExpr){
  const name = varExpr.replace('var(','').replace(')','').trim();
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
}

function getOportunidades(d){
  if(Array.isArray(d.oportunidades)) return d.oportunidades;
  const estado = (d.stage==='invoice'||d.stage==='pagado'||d.stage==='suscripcion') ? 'Pagado' : ((d.stage==='followup'||d.stage==='cx_followup') ? 'Pendiente' : 'En proceso');
  return [{id:'orig', nombre:'Oportunidad original', monto: Number(d.importe)||0, estado, fecha: d.fechaCierre||''}];
}
function sumOportunidades(d){
  return getOportunidades(d).reduce((s,o)=>s+(Number(o.monto)||0),0);
}
function getHistorial(d){ return Array.isArray(d.historial) ? d.historial : []; }
function getProgramas(d){ return Array.isArray(d.programas) ? d.programas : []; }

async function ensureDb(){
  if(!dbNs) dbNs = await claude.use('db');
  return dbNs;
}

/* ---------- pills / summary ---------- */
function renderPills(){
  const pillsEl = document.getElementById('pills');
  const total = allDocs.length;
  const totalSum = allDocs.reduce((s,d)=>s+sumOportunidades(d),0);
  let html = `<div class="pill all ${activeStage==='all'?'active':''}" data-stage="all">Todos <span class="n">${total} · ${money(totalSum)}</span></div>`;
  for(const s of STAGES){
    const docs = allDocs.filter(d=>d.stage===s.id);
    const sum = docs.reduce((a,d)=>a+sumOportunidades(d),0);
    html += `<div class="pill ${activeStage===s.id?'active':''}" data-stage="${s.id}">
      <span class="dot" style="background:${s.color}"></span>${s.label} <span class="n">${docs.length} · ${money(sum)}</span>
    </div>`;
  }
  pillsEl.innerHTML = html;
  pillsEl.querySelectorAll('.pill').forEach(p=>{
    p.addEventListener('click', ()=>{ activeStage = p.dataset.stage; visibleCount = PAGE; renderAll(); });
  });
}

function getFiltered(){
  let docs = allDocs;
  if(activeStage !== 'all') docs = docs.filter(d=>d.stage===activeStage);
  if(programFilter.length) docs = docs.filter(d=> getProgramas(d).some(p=>programFilter.includes(p)));
  if(clasifFilter.length) docs = docs.filter(d=> clasifFilter.includes(d.clasificacion || SIN_CLASIFICAR));
  if(searchTerm) docs = docs.filter(matchesSearch);
  docs = docs.slice().sort((a,b)=>{
    if(searchTerm){ const r = searchRank(a) - searchRank(b); if(r) return r; }   // lo que más se parece, primero
    const av=sumOportunidades(a), bv=sumOportunidades(b);
    return sortDir==='desc' ? bv-av : av-bv;
  });
  return docs;
}

/* ---------- búsqueda: sin distinguir mayúsculas ni tildes ---------- */
const fold = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function matchesSearch(d){
  const t = fold(searchTerm.trim());
  return fold(d.nombre).includes(t) || fold(d.correo).includes(t);
}
function searchRank(d){
  const t = fold(searchTerm.trim()), n = fold(d.nombre);
  if(n.startsWith(t)) return 0;
  if(n.split(/\s+/).some(w => w.startsWith(t))) return 1;
  if(n.includes(t)) return 2;
  return 3;
}
// Panel de resultados (vista Kanban): nombre, correo, etapa donde está e importe; clic abre la ficha
function renderSearchResults(docs){
  const el = document.getElementById('searchResults');
  if(!searchTerm.trim()){ el.hidden = true; el.innerHTML = ''; return; }
  const list = docs.slice().sort((a,b)=> searchRank(a) - searchRank(b) || sumOportunidades(b) - sumOportunidades(a));
  const shown = list.slice(0, 100);
  const rows = shown.map(d => {
    const s = STAGE_BY_ID[d.stage] || STAGES[0];
    return `<button class="srow" type="button" data-sr="${escapeHtml(d.id)}"><span class="dot" style="background:${s.color}"></span><span class="srname">${escapeHtml(d.nombre||'(sin nombre)')}</span><span class="srmail">${escapeHtml(d.correo||'')}</span><span class="srstage">${s.label}</span><span class="srmoney">${money(sumOportunidades(d))}</span></button>`;
  }).join('');
  el.hidden = false;
  el.innerHTML = `<div class="srhead"><b>${list.length} resultado${list.length===1?'':'s'}</b> para «${escapeHtml(searchTerm.trim())}» · haz clic para abrir la ficha</div>`
    + (list.length ? `<div class="srlist">${rows}${list.length > shown.length ? `<div class="srmore">Mostrando los primeros ${shown.length}. Escribe más para afinar.</div>` : ''}</div>` : '<div class="srempty">No encontramos clientes con ese nombre o correo.</div>');
  el.querySelectorAll('[data-sr]').forEach(b => b.addEventListener('click', () => openDetail(b.dataset.sr)));
}

function renderAll(){
  renderPills();
  if(viewMode==='list') renderListView(); else renderKanbanView();
}

/* ---------- list view ---------- */
function stageOptionsHtml(current){
  return STAGES.map(s=>`<option value="${s.id}" ${s.id===current?'selected':''}>${s.label}</option>`).join('');
}
function cardHtml(d){
  const dis = canWrite===false ? 'disabled' : '';
  return `<div class="card" data-id="${d.id}">
    <div class="row1">
      <div class="nombre" data-open="${d.id}">${escapeHtml(d.nombre||'(sin nombre)')}</div>
      <div class="importe">${money(sumOportunidades(d))}</div>
    </div>
    <div class="contact">
      ${d.correo?`<span>${escapeHtml(d.correo)}</span>`:''}
      ${d.telefono?`<span>${escapeHtml(d.telefono)}</span>`:''}
      ${d.fechaCierre?`<span class="fecha">Cierre: ${escapeHtml(d.fechaCierre)}</span>`:''}
    </div>
    <div class="row3">
      <select class="stagepick" data-id="${d.id}" ${dis}>${stageOptionsHtml(d.stage)}</select>
      <input class="notas" data-id="${d.id}" type="text" placeholder="Agregar nota rápida…" value="${escapeHtml(d.notas||'')}" ${dis}>
    </div>
  </div>`;
}
function renderListView(){
  document.getElementById('listView').style.display='flex';
  document.getElementById('kanbanView').style.display='none';
  document.getElementById('searchResults').hidden = true;
  const listEl = document.getElementById('listView');
  const countEl = document.getElementById('countLabel');
  const filtered = getFiltered();
  countEl.textContent = filtered.length ? `${filtered.length} cliente${filtered.length===1?'':'s'}` : '';
  if(!filtered.length){
    listEl.innerHTML = `<div class="empty">${allDocs.length===0 ? 'Aún no hay clientes cargados.' : 'No encontramos clientes con ese filtro.'}</div>`;
    return;
  }
  const shown = filtered.slice(0, visibleCount);
  let html = shown.map(cardHtml).join('');
  if(filtered.length > shown.length){
    html += `<button class="loadmore" id="loadMoreBtn">Cargar más (${filtered.length - shown.length} restantes)</button>`;
  }
  listEl.innerHTML = html;
  const lm = document.getElementById('loadMoreBtn');
  if(lm) lm.addEventListener('click', ()=>{ visibleCount += PAGE; renderListView(); });

  listEl.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(el.dataset.open));
  });
  listEl.querySelectorAll('.stagepick').forEach(sel=>{
    sel.addEventListener('change', (e)=> moveStage(e.target.dataset.id, e.target.value));
  });
  listEl.querySelectorAll('.notas').forEach(inp=>{
    let lastSaved = inp.value;
    const save = async ()=>{
      const id = inp.dataset.id, val = inp.value;
      if(val === lastSaved) return;
      lastSaved = val;
      const doc = allDocs.find(d=>d.id===id);
      if(doc) doc.notas = val;
      try{ await (await ensureDb()).collection('clients').doc(id).update({notas: val}); }catch(err){}
    };
    inp.addEventListener('blur', save);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
  });
}

async function moveStage(id, newStage){
  const doc = allDocs.find(d=>d.id===id);
  if(!doc) return;
  const prev = doc.stage;
  doc.stage = newStage;
  renderAll();
  try{
    const db = await ensureDb();
    if(!db) throw new Error('no db');
    await db.collection('clients').doc(id).update({stage:newStage});
  }catch(err){
    doc.stage = prev;
    renderAll();
  }
}

/* ---------- kanban view ---------- */
function kcardHtml(d){
  return `<div class="kcard" draggable="${canWrite!==false}" data-id="${d.id}">
    <div class="kname" data-open="${d.id}">${escapeHtml(d.nombre||'(sin nombre)')}</div>
    <div class="kimporte">${money(sumOportunidades(d))}</div>
  </div>`;
}
function renderKanbanView(){
  document.getElementById('listView').style.display='none';
  document.getElementById('kanbanView').style.display='block';
  document.getElementById('countLabel').textContent = '';
  const board = document.getElementById('board');
  let allFiltered = allDocs;
  if(programFilter.length) allFiltered = allFiltered.filter(d=> getProgramas(d).some(p=>programFilter.includes(p)));
  if(clasifFilter.length) allFiltered = allFiltered.filter(d=> clasifFilter.includes(d.clasificacion || SIN_CLASIFICAR));
  if(searchTerm) allFiltered = allFiltered.filter(matchesSearch);
  renderSearchResults(allFiltered);
  let stagesToShow = activeStage==='all' ? STAGES : STAGES.filter(s=>s.id===activeStage);
  if(searchTerm.trim()){   // al buscar, solo las columnas donde hay resultados
    const withHits = stagesToShow.filter(s => allFiltered.some(d => d.stage === s.id));
    if(withHits.length) stagesToShow = withHits;
  }
  board.innerHTML = stagesToShow.map(s=>{
    const docs = allFiltered.filter(d=>d.stage===s.id).slice().sort((a,b)=>{
      const av=sumOportunidades(a), bv=sumOportunidades(b);
      return sortDir==='desc' ? bv-av : av-bv;
    });
    const sum = docs.reduce((a,d)=>a+sumOportunidades(d),0);
    const vis = colVisible[s.id] || COL_PAGE;
    const shown = docs.slice(0, vis);
    const more = docs.length - shown.length;
    return `<div class="col" data-stage="${s.id}">
      <div class="col-head">
        <div class="label"><span class="dot" style="background:${s.color}"></span>${s.label}</div>
        <div class="meta">${docs.length} · ${money(sum)}</div>
      </div>
      <div class="col-cards" data-stage="${s.id}">
        ${shown.map(kcardHtml).join('') || '<div style="color:var(--fg-muted);font-size:.78rem;padding:8px 2px">Sin clientes</div>'}
      </div>
      ${more>0 ? `<button class="col-loadmore" data-more="${s.id}">Cargar ${Math.min(more,COL_PAGE)} más</button>` : ''}
    </div>`;
  }).join('');

  board.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(el.dataset.open));
  });
  board.querySelectorAll('[data-more]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const s = btn.dataset.more;
      colVisible[s] = (colVisible[s] || COL_PAGE) + COL_PAGE;
      renderKanbanView();
    });
  });
  if(canWrite !== false){
    board.querySelectorAll('.kcard').forEach(card=>{
      card.addEventListener('dragstart', e=>{
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', card.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    });
    board.querySelectorAll('.col-cards').forEach(zone=>{
      zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.closest('.col').classList.add('dragover'); });
      zone.addEventListener('dragleave', ()=> zone.closest('.col').classList.remove('dragover'));
      zone.addEventListener('drop', e=>{
        e.preventDefault();
        zone.closest('.col').classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        const newStage = zone.dataset.stage;
        if(id) moveStage(id, newStage);
      });
    });
  }
}

  document.getElementById('btnViewKanban').classList.add('active');
  document.getElementById('btnViewList').classList.remove('active');
  renderAll();
});

async function boot(){
  try{
    dbNs = await claude.use('db');
    userNs = await claude.use('user');
    if(userNs){
      try{
        const can = userNs.can ? userNs.can('data.write') : null;
        canWrite = (can === null || can === undefined) ? true : can;
      }catch(e){ canWrite = true; }
    }
    if(!dbNs){
      document.getElementById('listView').innerHTML = '<div class="empty">No se pudo conectar a los datos del pipeline.</div>';
      return;
    }
    if(canWrite === false){
      document.getElementById('roBanner').innerHTML = '<div class="readonly-banner">Estás en modo de solo lectura: puedes ver la cartera pero no mover clientes ni editar datos.</div>';
      document.getElementById('newClientBtn').style.display='none';
    }
    dbNs.collection('clients').onSnapshot(
      (snap)=>{
        allDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
        renderAll();
      },
      (err)=>{ document.getElementById('listView').innerHTML = '<div class="empty">No se pudo cargar la cartera. Intenta recargar la página.</div>'; }
    );
  }catch(e){
    document.getElementById('listView').innerHTML = '<div class="empty">No se pudo cargar la cartera. Intenta recargar la página.</div>';
  }
}

function start(){ boot(); }
if(window.claude && window.claude.hot && window.claude.hot.ready){
  window.claude.hot.ready(start);
} else {
  start();
}
</script>

<script>
/* ---------- Importar clientes desde CSV (Google Sheets -> Archivo -> Descargar -> CSV) ---------- */
(function(){
  const $ = id => document.getElementById(id);
  const unaccent = s => String(s == null ? '' : s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const slug = s => unaccent(s).replace(/[^a-z0-9]/g, '');
  const decodeHtml = s => String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
  const MAX_BYTES = 20 * 1024 * 1024;

  /* ----- lectura del archivo ----- */
  async function readFile(file){
    if(file.size > MAX_BYTES) throw new Error('El archivo pesa más de 20 MB. Divídelo en partes.');
    const buf = await file.arrayBuffer(), u8 = new Uint8Array(buf);
    if(u8[0] === 0x50 && u8[1] === 0x4B) throw new Error('Este archivo parece de Excel (.xlsx). Descárgalo como CSV: Archivo → Descargar → Valores separados por comas (.csv).');
    if(u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
    if(u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
    if(u8.includes(0)) throw new Error('El archivo no parece un CSV de texto.');
    try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch(e){ return new TextDecoder('windows-1252').decode(buf); }   // CSV viejo de Excel (acentos en ANSI)
  }

  /* ----- CSV ----- */
  function detectDelimiter(text){
    const counts = {',':0, ';':0, '\t':0}; let q = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(c === '"') q = !q;
      else if(!q){
        if(c === '\n'){ if(counts[','] + counts[';'] + counts['\t']) break; continue; }
        if(c in counts) counts[c]++;
      }
    }
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || ',';
  }
  function parseCSV(text, delim){
    delim = delim || ',';
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = []; let row = [], f = '', q = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
      else if(c === '"') q = true;
      else if(c === delim){ row.push(f); f = ''; }
      else if(c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
      else if(c !== '\r') f += c;
    }
    if(f.length || row.length){ row.push(f); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }

  /* ----- importes: acepta $1,500 · 1500.50 · 1.500,50 · 1500,5 · (100) ----- */
  function parseMoney(raw){
    let s = String(raw == null ? '' : raw).trim();
    if(!s) return {v:0, st:'empty'};
    let neg = false;
    if(/^-?\d+(\.\d+)?e[+-]?\d+$/i.test(s)){ const v = Number(s); return isFinite(v) ? {v: Math.round(v * 100) / 100, st:'ambiguous'} : {v:0, st:'bad'}; }
    if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1, -1); }
    if(s.includes('-')) neg = true;
    s = s.replace(/[^\d.,]/g, '');
    if(!/\d/.test(s)) return {v:0, st:'bad'};
    let st = 'ok';
    const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
    if(lastDot >= 0 && lastComma >= 0){
      const dec = lastDot > lastComma ? '.' : ',', thou = dec === '.' ? ',' : '.';
      s = s.split(thou).join('').replace(dec, '.');
    }else if(lastComma >= 0){
      if(/^\d{1,3}(,\d{3})+$/.test(s)){ if(/^\d{1,3},\d{3}$/.test(s)) st = 'ambiguous'; s = s.replace(/,/g, ''); }
      else s = s.replace(/\./g, '').replace(',', '.');
    }else if(lastDot >= 0){
      if(/^\d{1,3}(\.\d{3}){2,}$/.test(s)) s = s.replace(/\./g, '');
      else if(/^\d{1,3}\.\d{3}$/.test(s)){ st = 'ambiguous'; s = s.replace('.', ''); }
    }
    let v = Number(s);
    if(!isFinite(v)) return {v:0, st:'bad'};
    v = Math.round(v * 100) / 100;
    if(neg && v) { v = -v; st = 'negative'; }
    return {v, st};
  }

  /* ----- columnas (acepta variantes: "Correo Electrónico", "E-mail", "Número de Teléfono"…) ----- */
  const COLS = [
    ['programas', s => /programa|program/.test(s)],
    ['fechaCierre', s => /cierre/.test(s)],
    ['importe', s => /importe|monto|valor|amount|precio/.test(s)],
    ['stage', s => /^(stage|etapa)/.test(s)],
    ['correo', s => /correo|email|mail/.test(s)],
    ['telefono', s => /telefono|^tel$|phone|^cel|whatsapp|movil/.test(s)],
    ['nombre', s => /nombre|name|cliente|estudiante|alumno/.test(s)]
  ];
  const POSITIONAL = {nombre:0, correo:1, telefono:2, programas:3};   // archivo sin encabezado
  const stageId = v => {
    const s = slug(v); if(!s) return {id:'lead', known:true};
    const hit = STAGES.find(x => slug(decodeHtml(x.label)) === s || slug(x.id) === s);
    return hit ? {id:hit.id, known:true} : {id:'lead', known:false};
  };
  const progId = v => PROGRAMAS.find(p => slug(p) === slug(v));
  const histAuto = texto => ({ts:new Date().toISOString(), tipo:'auto', texto});
  const fixMojibake = s => { s = String(s == null ? '' : s); if(!/[ÃÂ]/.test(s)) return s; try{ return decodeURIComponent(escape(s)); }catch(e){ return s; } };
  const squash = s => unaccent(fixMojibake(s)).replace(/\s+/g, ' ');
  const keyOf = (n, c, i) => squash(n) + '|' + squash(c) + '|' + (Math.round((Number(i) || 0) * 100) / 100);
  const ncKey = (n, c) => squash(n) + '|' + squash(c);

  /* ----- plan: qué se agregaría y qué se actualizaría, sin tocar nada ----- */
  // - Con columna Importe: cada fila es un cliente (clave nombre+correo+importe, por conteo).
  // - Sin Importe: un cliente es nombre+correo; si ya existe solo se le suman los programas.
  // - Con o sin Importe, si el archivo trae Programa, se suman a los clientes que ya existan.
  function plan(text, docs){
    const delim = detectDelimiter(text);
    const rows = parseCSV(text, delim);
    if(!rows.length) return {error:'El archivo está vacío.'};
    let idx = {}, noHeader = false;
    rows[0].map(slug).forEach((h, i) => { for(const [k, fn] of COLS){ if(idx[k] === undefined && fn(h)){ idx[k] = i; break; } } });
    if(idx.nombre === undefined){
      if(rows.slice(0, 5).some(r => String(r[1] || '').includes('@'))){ idx = Object.assign({}, POSITIONAL); noHeader = true; }
      else return {error:'No encontré la columna "Nombre". Encabezados que veo: ' + rows[0].map(c => '"' + String(c).trim() + '"').join(', ') + '. Renombra la columna o usa el orden Nombre, Correo, Teléfono, Programa sin encabezado.'};
    }
    const body = noHeader ? rows : rows.slice(1);
    if(!body.length) return {error:'El archivo no tiene filas de datos debajo del encabezado.'};
    const col = k => idx[k] === undefined ? -1 : idx[k];
    const hasImporte = col('importe') >= 0, hasProg = col('programas') >= 0;

    const byKey = {}, byNC = {};
    docs.forEach(d => {
      (byKey[keyOf(d.nombre, d.correo, d.importe)] = byKey[keyOf(d.nombre, d.correo, d.importe)] || []).push(d);
      (byNC[ncKey(d.nombre, d.correo)] = byNC[ncKey(d.nombre, d.correo)] || []).push(d);
    });
    const seen = {}, toAdd = [], newByNC = {}, upd = {};
    const w = {noName:0, badMoney:0, ambiguousMoney:0, negativeMoney:0, sciPhones:0, unknownStages:0};
    const unknownProgs = new Set();
    let existing = 0, repeatedHeaders = 0; const base = Date.now();

    const addProgsToExisting = (doc, progs) => {
      if(!progs.length) return;
      const cur = upd[doc.id] || (upd[doc.id] = {programas: getProgramas(doc).slice(), added: []});
      progs.forEach(p => { if(!cur.programas.includes(p)){ cur.programas.push(p); cur.added.push(p); } });
    };

    body.forEach(r => {
      const get = k => col(k) >= 0 ? String(r[col(k)] == null ? '' : r[col(k)]) : '';
      const nombre = get('nombre').trim();
      if(!nombre){ w.noName++; return; }
      if(!noHeader && slug(nombre) === 'nombre'){ repeatedHeaders++; return; }   // encabezado repetido a mitad del archivo
      const telefono = get('telefono').trim(), correo = get('correo').trim();
      if(/^\d(\.\d+)?e\+?\d+$/i.test(telefono)) w.sciPhones++;
      const progs = [];
      if(hasProg) get('programas').split(/[;|,\n]/).map(s => s.trim()).filter(Boolean).forEach(p => {
        const hit = progId(p); if(hit){ if(!progs.includes(hit)) progs.push(hit); } else unknownProgs.add(p);
      });
      let importe = 0;
      if(hasImporte){
        const m = parseMoney(get('importe')); importe = m.v;
        if(m.st === 'bad') w.badMoney++; else if(m.st === 'ambiguous') w.ambiguousMoney++; else if(m.st === 'negative') w.negativeMoney++;
      }

      if(hasImporte){
        const k = keyOf(nombre, correo, importe);
        seen[k] = (seen[k] || 0) + 1;
        const list = byKey[k] || [];
        if(seen[k] <= list.length){ existing++; addProgsToExisting(list[seen[k] - 1], progs); return; }
      }else{
        const nc = ncKey(nombre, correo);
        if(byNC[nc]){ existing++; addProgsToExisting(byNC[nc][0], progs); return; }
        if(newByNC[nc]){ progs.forEach(p => { if(!newByNC[nc].programas.includes(p)) newByNC[nc].programas.push(p); }); return; }   // misma persona repetida en el archivo
      }
      const st = stageId(get('stage'));
      if(!st.known) w.unknownStages++;
      const row = {nombre, telefono, correo, importe, stage:st.id, fechaCierre:get('fechaCierre').trim(), order: base + toAdd.length, programas: progs};
      toAdd.push(row);
      if(!hasImporte) newByNC[ncKey(nombre, correo)] = row;
    });

    const toUpdate = Object.entries(upd).filter(([, u]) => u.added.length).map(([id, u]) => ({id, programas:u.programas, added:u.added}));
    return {total: body.length - w.noName - repeatedHeaders, existing, toAdd, toUpdate, noHeader, delimiter: delim, hasImporte, hasProg, warnings: w, unknownProgs: [...unknownProgs],
            unknownStages: w.unknownStages, skipped: w.noName};
  }
  window.ImportLogic = {parseCSV, plan, parseMoney, detectDelimiter, slug, readFile};

  /* ----- pantalla ----- */
  const close = () => { $('importOverlay').hidden = true; };
  const render = html => { $('importModal').innerHTML = '<button class="close" id="impClose" aria-label="Cerrar">×</button>' + html; $('impClose').addEventListener('click', close); };
  const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

  function stepPick(){
    render(`<h2>Importar clientes</h2>
      <p class="ophint" style="margin:0 0 12px">En tu Google Sheet: Archivo → Descargar → Valores separados por comas (.csv).<br>Columnas con encabezado: Stage, Nombre, Correo Electronico, Numero de Telefono, Importe, Fecha de Cierre, Programa. Si el archivo no tiene encabezado, se asume este orden: Nombre, Correo, Teléfono, Programa.<br>Solo se agregan clientes nuevos y programas nuevos; no se borra ni se cambia nada de lo que ya tienes. Antes de guardar verás un resumen para confirmar.</p>
      <div class="field"><input id="impFile" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain"></div>
      <div id="impMsg" class="ophint" style="margin-top:10px"></div>`);
    $('impFile').addEventListener('change', async e => {
      const file = e.target.files[0]; if(!file) return;
      $('impMsg').textContent = 'Leyendo archivo…';
      try{
        const res = plan(await readFile(file), allDocs);
        if(res.error){ $('impMsg').textContent = res.error; return; }
        stepConfirm(res);
      }catch(err){ $('impMsg').textContent = err && err.message ? err.message : 'No se pudo leer el archivo.'; }
    });
  }

  function stepConfirm(res){
    const n = res.toAdd.length, u = res.toUpdate.length, work = n + u, w = res.warnings;
    const parts = [n ? 'agregar ' + plural(n, 'cliente nuevo', 'clientes nuevos') : '', u ? 'sumar programas a ' + plural(u, 'cliente existente', 'clientes existentes') : ''].filter(Boolean);
    const notes = [];
    if(res.noHeader) notes.push('El archivo no tiene encabezado: interpreté las columnas como Nombre, Correo, Teléfono, Programa.');
    if(w.noName) notes.push(plural(w.noName, 'fila sin nombre se omitió', 'filas sin nombre se omitieron') + '.');
    if(w.unknownStages) notes.push(plural(w.unknownStages, 'fila con etapa desconocida entra', 'filas con etapa desconocida entran') + ' como "Lead".');
    if(res.unknownProgs.length) notes.push('Programas que no existen en tu lista y se ignoran: ' + res.unknownProgs.map(escapeHtml).join(', ') + '. Puedes crearlos en Configuración y volver a importar.');
    if(w.badMoney) notes.push(plural(w.badMoney, 'importe no es un número y quedó en', 'importes no son números y quedaron en') + ' $0.');
    if(w.ambiguousMoney) notes.push(plural(w.ambiguousMoney, 'importe tiene un separador dudoso', 'importes tienen un separador dudoso') + ' (por ejemplo 1.500 o 1,500; se leyó como mil quinientos). Revísalos.');
    if(w.negativeMoney) notes.push(plural(w.negativeMoney, 'importe es negativo', 'importes son negativos') + '. Revísalo.');
    if(w.sciPhones) notes.push(plural(w.sciPhones, 'teléfono viene en notación científica', 'teléfonos vienen en notación científica') + ' (ej. 1.8E+10): Excel dañó el número. Revisa el archivo.');
    const sample = res.toAdd.slice(0, 5).map(r => `<div class="cfgnote" style="margin:2px 0">• ${escapeHtml(r.nombre)}${r.correo ? ' · ' + escapeHtml(r.correo) : ''}${r.importe ? ' · $' + r.importe : ''}${r.programas.length ? ' · ' + r.programas.map(escapeHtml).join(' + ') : ''}</div>`).join('');
    render(`<h2>Importar clientes</h2>
      <p style="margin:0 0 6px"><b>${res.total}</b> filas en el archivo · <b>${res.existing}</b> ya existen · <b>${n}</b> nuevas${u ? ' · <b>' + u + '</b> con programas por sumar' : ''}</p>
      ${n ? `<div style="margin:0 0 8px"><div class="cfgnote" style="margin-bottom:2px">Primeros clientes nuevos:</div>${sample}${n > 5 ? `<div class="cfgnote">… y ${n - 5} más</div>` : ''}</div>` : ''}
      ${notes.map(t => `<p class="ophint" style="margin:0 0 6px">${t}</p>`).join('')}
      <div id="impMsg" class="ophint"></div>
      <div class="modalactions">
        <button class="ghostbtn" id="impBack" type="button">Cancelar</button>
        <button class="primarybtn" id="impGo" type="button" ${work ? '' : 'disabled'}>${work ? 'Confirmar: ' + parts.join(' y ') : 'Nada nuevo que agregar'}</button>
      </div>`);
    $('impBack').addEventListener('click', close);
    $('impGo').addEventListener('click', async () => {
      $('impGo').disabled = true; $('impBack').disabled = true; $('impMsg').textContent = 'Importando… no cierres esta ventana.';
      try{
        const db = await claude.use('db');
        const rows = res.toAdd.map(r => {
          const o = Object.assign({}, r);
          if(!o.programas.length) delete o.programas;
          else o.historial = o.programas.map(p => histAuto('Programa agregado: ' + p));
          return o;
        });
        if(rows.length) await db.collection('clients').addMany(rows);
        for(const up of res.toUpdate){
          const doc = allDocs.find(d => d.id === up.id);
          await db.collection('clients').doc(up.id).update({programas: up.programas, historial: getHistorial(doc || {}).concat(up.added.map(p => histAuto('Programa agregado: ' + p)))});
        }
        if(u && window.__reloadClients) window.__reloadClients();
        render(`<h2>Listo</h2><p>${n ? 'Se agregaron <b>' + n + '</b> cliente' + (n === 1 ? '' : 's') + '. ' : ''}${u ? 'Se sumaron programas a <b>' + u + '</b> cliente' + (u === 1 ? '' : 's') + '.' : ''}</p>
          <div class="modalactions"><button class="primarybtn" id="impDone" type="button">Cerrar</button></div>`);
        $('impDone').addEventListener('click', close);
      }catch(err){
        if(window.__reloadClients) window.__reloadClients();
        $('impBack').disabled = false;
        $('impMsg').textContent = 'No se pudo terminar: ' + (err && err.message ? err.message : 'error desconocido') + '. Es posible que una parte ya se haya guardado. Cierra esta ventana y vuelve a subir el mismo archivo: no se duplicará nada.';
      }
    });
  }
  $('importBtn').addEventListener('click', () => { stepPick(); $('importOverlay').hidden = false; });
  $('importOverlay').addEventListener('click', e => { if(e.target.id === 'importOverlay') close(); });

  // Solo los editores ven el botón
  if(window.claude) claude.use('user').then(u => { if(u && u.can('data.write')) $('importBtn').style.display = ''; });
})();
</script>

<script>
/* ---------- Configuración: etapas, listas, textos y campos personalizados ---------- */
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => escapeHtml(s);
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const rid = p => p + Math.random().toString(36).slice(2, 8);
  const ORIG = {
    appName: 'Pipeline de Upsell',
    subtitle: (window.APP_CONFIG && window.APP_CONFIG.SUBTITLE) || 'Cartera de Miguel Vélez · Abacus Exchange',
    calendlyUrl: CALENDLY_URL,
    stages: STAGES.map(s => ({id:s.id, label:s.label, hint:s.hint, color:s.color})),
    programas: PROGRAMAS.slice(),
    clasificaciones: CLASIFICACIONES.slice(),
    customFields: []
  };
  let CURRENT = JSON.parse(JSON.stringify(ORIG));
  let draft = null;
  const safeColor = c => (/^#[0-9a-f]{6}$/i.test(c) || /^var\(--stage-[a-z-]+\)$/.test(c)) ? c : '#64748B';
  const cleanUrl = u => String(u || '').replace(/["'<>\s]/g, '');
  const arr = (v, d) => Array.isArray(v) && v.length ? v : d;

  function applySettings(cfg){
    const stages = arr(cfg.stages, ORIG.stages).map(s => ({id:s.id, label:esc(s.label || ''), hint:esc(s.hint || ''), color:safeColor(s.color)}));
    STAGES.splice(0, STAGES.length, ...stages);
    Object.keys(STAGE_BY_ID).forEach(k => delete STAGE_BY_ID[k]);
    stages.forEach(s => { STAGE_BY_ID[s.id] = s; });
    PROGRAMAS.splice(0, PROGRAMAS.length, ...(Array.isArray(cfg.programas) ? cfg.programas : ORIG.programas));
    CLASIFICACIONES.splice(0, CLASIFICACIONES.length, ...(Array.isArray(cfg.clasificaciones) ? cfg.clasificaciones : ORIG.clasificaciones));
    CLASIF_FILTER_OPTIONS.splice(0, CLASIF_FILTER_OPTIONS.length, ...CLASIFICACIONES, SIN_CLASIFICAR);
    const url = cleanUrl(cfg.calendlyUrl);
    if(/^https?:\/\//i.test(url)) CALENDLY_URL = url;
    $('appName').textContent = cfg.appName || ORIG.appName;
    document.title = cfg.appName || ORIG.appName;
    $('subText').textContent = cfg.subtitle || '';
    window.CUSTOM_FIELDS = Array.isArray(cfg.customFields) ? cfg.customFields : [];
  }

  // Se ejecuta una vez, tras el login y antes de pintar la cartera
  window.__beforeBoot = async () => {
    const {data} = await window.__sb.from('app_settings').select('data').eq('id', 1).maybeSingle();
    if(data && data.data) CURRENT = Object.assign({}, ORIG, data.data);
    applySettings(CURRENT);
  };

  /* ----- campos personalizados dentro de la ficha ----- */
  window.customFieldsHtml = (d, dis) => (window.CUSTOM_FIELDS || []).map(f => {
    const v = (d.custom || {})[f.id];
    const val = v == null ? '' : v;
    const off = dis ? 'disabled' : '';
    let input;
    if(f.type === 'list') input = `<select data-cf="${esc(f.id)}" ${off}><option value="">—</option>${(f.options || []).map(o => `<option ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else input = `<input data-cf="${esc(f.id)}" type="${f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text'}" value="${esc(val)}" ${off}>`;
    return `<div class="field"><label>${esc(f.label)}</label>${input}</div>`;
  }).join('');
  window.bindCustomFields = (saveField) => {
    document.querySelectorAll('#detailModal [data-cf]').forEach(el => {
      const ev = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'blur';
      let last = el.value;
      el.addEventListener(ev, () => {
        if(el.value === last) return;
        last = el.value;
        const doc = allDocs.find(x => x.id === openDocId);
        if(!doc) return;
        const custom = Object.assign({}, doc.custom || {});
        const val = el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value;
        if(val === null || val === '') delete custom[el.dataset.cf]; else custom[el.dataset.cf] = val;
        saveField('custom', custom);
      });
    });
  };

  /* ----- pantalla de configuración ----- */
  const countStage = id => allDocs.filter(d => d.stage === id).length;
  const countProg = n => allDocs.filter(d => getProgramas(d).includes(n)).length;
  const countClasif = n => allDocs.filter(d => d.clasificacion === n).length;
  const hexOf = c => /^#[0-9a-f]{6}$/i.test(c) ? c : (resolvedColor(c).match(/^#[0-9a-f]{6}$/i) ? resolvedColor(c) : '#64748B');

  function mkDraft(){
    const c = CURRENT;
    return {
      appName: c.appName, subtitle: c.subtitle, calendlyUrl: c.calendlyUrl || '',
      stages: arr(c.stages, ORIG.stages).map(s => ({id:s.id, label:s.label, hint:s.hint || '', color:s.color, isNew:false, deleted:false, moveTo:''})),
      programas: (c.programas || []).map(n => ({orig:n, name:n, deleted:false})),
      clasificaciones: (c.clasificaciones || []).map(n => ({orig:n, name:n, deleted:false})),
      customFields: (c.customFields || []).map(f => ({id:f.id, label:f.label, type:f.type, options:(f.options || []).join(', '), isNew:false, deleted:false}))
    };
  }

  function listRows(key, countFn, noun){
    return draft[key].map((r, i) => r.deleted
      ? `<div class="cfgrow gone"><span style="flex:1"><s>${esc(r.name)}</s> <span class="cfgnote">se quitará${r.orig && countFn(r.orig) ? ' de ' + countFn(r.orig) + ' cliente(s)' : ''}</span></span><button class="smallbtn" data-act="undo" data-k="${key}" data-i="${i}" type="button">Deshacer</button></div>`
      : `<div class="cfgrow"><input type="text" data-k="${key}" data-i="${i}" data-f="name" value="${esc(r.name)}" placeholder="${noun}">${r.orig ? `<span class="cfgnote">${countFn(r.orig)} cliente(s)</span>` : ''}<button class="ib" data-act="del" data-k="${key}" data-i="${i}" title="Quitar" type="button">✕</button></div>`).join('');
  }

  function render(){
    const D = draft, active = D.stages.filter(s => !s.deleted);
    const stageRows = D.stages.map((s, i) => {
      if(s.deleted){
        const n = s.isNew ? 0 : countStage(s.id);
        return `<div class="cfgrow gone"><span style="flex:1"><s>${esc(s.label)}</s> <span class="cfgnote">se eliminará</span>${n ? ` · mover sus ${n} cliente(s) a: <select data-k="stages" data-i="${i}" data-f="moveTo" style="max-width:200px">${active.map(a => `<option value="${esc(a.id)}" ${s.moveTo === a.id ? 'selected' : ''}>${esc(a.label || '(sin nombre)')}</option>`).join('')}</select>` : ''}</span><button class="smallbtn" data-act="undo" data-k="stages" data-i="${i}" type="button">Deshacer</button></div>`;
      }
      return `<div class="cfgrow"><input type="color" data-k="stages" data-i="${i}" data-f="color" value="${hexOf(s.color)}" title="Color"><input type="text" data-k="stages" data-i="${i}" data-f="label" value="${esc(s.label)}" placeholder="Nombre de la etapa"><input type="text" data-k="stages" data-i="${i}" data-f="hint" value="${esc(s.hint)}" placeholder="Descripción corta (opcional)"><button class="ib" data-act="up" data-k="stages" data-i="${i}" title="Subir" type="button">↑</button><button class="ib" data-act="down" data-k="stages" data-i="${i}" title="Bajar" type="button">↓</button><button class="ib" data-act="del" data-k="stages" data-i="${i}" title="Eliminar" type="button">✕</button></div>`;
    }).join('');
    const cfRows = D.customFields.map((f, i) => f.deleted
      ? `<div class="cfgrow gone"><span style="flex:1"><s>${esc(f.label)}</s> <span class="cfgnote">se quitará de la ficha (los datos guardados no se borran)</span></span><button class="smallbtn" data-act="undo" data-k="customFields" data-i="${i}" type="button">Deshacer</button></div>`
      : `<div class="cfgrow"><input type="text" data-k="customFields" data-i="${i}" data-f="label" value="${esc(f.label)}" placeholder="Nombre del campo"><select data-k="customFields" data-i="${i}" data-f="type" ${f.isNew ? '' : 'disabled'}>${[['text','Texto'],['number','Número'],['date','Fecha'],['list','Lista']].map(([v, l]) => `<option value="${v}" ${f.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select>${f.type === 'list' ? `<input type="text" data-k="customFields" data-i="${i}" data-f="options" value="${esc(f.options)}" placeholder="Opciones separadas por coma">` : ''}<button class="ib" data-act="del" data-k="customFields" data-i="${i}" title="Quitar" type="button">✕</button></div>`).join('');

    $('settingsModal').innerHTML = `
      <button class="close" id="cfgClose" aria-label="Cerrar">×</button>
      <h2>Configuración</h2>
      <p class="cfgnote" style="margin:0 0 4px">Los cambios se aplican a todos los usuarios al pulsar "Guardar cambios".</p>

      <div class="cfgsec"><h3>Textos y enlaces</h3></div>
      <div class="fieldgrid" style="margin-bottom:0">
        <div class="field"><label>Nombre de la app</label><input data-k="root" data-f="appName" value="${esc(D.appName)}"></div>
        <div class="field"><label>Subtítulo</label><input data-k="root" data-f="subtitle" value="${esc(D.subtitle)}"></div>
        <div class="field" style="grid-column:1/-1"><label>Enlace de Calendly</label><input data-k="root" data-f="calendlyUrl" value="${esc(D.calendlyUrl)}" placeholder="https://calendly.com/..."></div>
      </div>

      <div class="cfgsec"><h3>Etapas del pipeline</h3><button class="smallbtn" data-act="add" data-k="stages" type="button">+ Agregar etapa</button></div>
      ${stageRows}

      <div class="cfgsec"><h3>Programas</h3><button class="smallbtn" data-act="add" data-k="programas" type="button">+ Agregar</button></div>
      ${listRows('programas', countProg, 'Nombre del programa')}

      <div class="cfgsec"><h3>Clasificaciones</h3><button class="smallbtn" data-act="add" data-k="clasificaciones" type="button">+ Agregar</button></div>
      ${listRows('clasificaciones', countClasif, 'Nombre de la clasificación')}

      <div class="cfgsec"><h3>Campos personalizados</h3><button class="smallbtn" data-act="add" data-k="customFields" type="button">+ Agregar campo</button></div>
      <p class="cfgnote" style="margin:0 0 8px">Aparecen en la ficha de cada cliente, junto a Etapa. El tipo no se puede cambiar después de guardar.</p>
      ${cfRows || '<p class="cfgnote">Aún no hay campos personalizados.</p>'}

      <div id="cfgMsg" class="cfgerr"></div>
      <div class="modalactions">
        <button class="ghostbtn" id="cfgCancel" type="button">Cancelar</button>
        <button class="primarybtn" id="cfgSave" type="button">Guardar cambios</button>
      </div>`;
    $('cfgClose').addEventListener('click', closeCfg);
    $('cfgCancel').addEventListener('click', closeCfg);
    $('cfgSave').addEventListener('click', save);
  }
  const rerender = () => { const o = $('settingsOverlay'), y = o.scrollTop; render(); o.scrollTop = y; };
  const closeCfg = () => { $('settingsOverlay').hidden = true; draft = null; };

  $('settingsModal').addEventListener('input', e => {
    const t = e.target, k = t.dataset.k, f = t.dataset.f;
    if(!k || !f) return;
    if(k === 'root') draft[f] = t.value; else draft[k][+t.dataset.i][f] = t.value;
  });
  $('settingsModal').addEventListener('change', e => {
    const t = e.target;
    if(t.dataset.f === 'type') rerender();
  });
  $('settingsModal').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b) return;
    const k = b.dataset.k, i = +b.dataset.i, list = draft[k], act = b.dataset.act;
    if(act === 'add'){
      if(k === 'stages') list.push({id:rid('e_'), label:'', hint:'', color:'#3B82F6', isNew:true, deleted:false, moveTo:''});
      else if(k === 'customFields') list.push({id:rid('cf_'), label:'', type:'text', options:'', isNew:true, deleted:false});
      else list.push({orig:null, name:'', deleted:false});
    }else if(act === 'del'){
      const r = list[i];
      if(r.isNew || (k !== 'stages' && !r.orig && !r.id)) list.splice(i, 1);
      else {
        r.deleted = true;
        if(k === 'stages'){ const other = list.find((s, j) => j !== i && !s.deleted); r.moveTo = other ? other.id : ''; }
      }
    }else if(act === 'undo') list[i].deleted = false;
    else if(act === 'up' && i > 0) [list[i-1], list[i]] = [list[i], list[i-1]];
    else if(act === 'down' && i < list.length - 1) [list[i+1], list[i]] = [list[i], list[i+1]];
    rerender();
  });

  async function save(){
    const D = draft, msg = t => { $('cfgMsg').textContent = t; };
    const dupe = names => { const s = new Set(); for(const n of names){ const k = n.trim().toLowerCase(); if(s.has(k)) return n; s.add(k); } return null; };
    const aStages = D.stages.filter(s => !s.deleted);
    if(!D.appName.trim()) return msg('Escribe el nombre de la app.');
    if(D.calendlyUrl.trim() && !/^https?:\/\//i.test(D.calendlyUrl.trim())) return msg('El enlace de Calendly debe empezar con https://');
    if(!aStages.length) return msg('Tiene que quedar al menos una etapa.');
    if(aStages.some(s => !s.label.trim())) return msg('Todas las etapas necesitan nombre.');
    let d = dupe(aStages.map(s => s.label)); if(d) return msg('Hay dos etapas con el nombre "' + d + '".');
    for(const s of D.stages.filter(s => s.deleted && !s.isNew && countStage(s.id))){
      if(!aStages.some(a => a.id === s.moveTo)) return msg('Elige a qué etapa mover los clientes de "' + s.label + '".');
    }
    for(const [key, noun] of [['programas', 'programas'], ['clasificaciones', 'clasificaciones']]){
      const act = D[key].filter(r => !r.deleted);
      if(act.some(r => !r.name.trim())) return msg('Hay ' + noun + ' sin nombre.');
      d = dupe(act.map(r => r.name)); if(d) return msg('Hay ' + noun + ' repetidos: "' + d + '".');
    }
    const aCf = D.customFields.filter(f => !f.deleted);
    if(aCf.some(f => !f.label.trim())) return msg('Todos los campos personalizados necesitan nombre.');
    if(aCf.some(f => f.type === 'list' && !f.options.split(',').some(o => o.trim()))) return msg('Los campos tipo Lista necesitan al menos una opción.');

    $('cfgSave').disabled = true; msg('Guardando…');
    const sb = window.__sb;
    try{
      for(const s of D.stages.filter(s => s.deleted && !s.isNew)){
        const {error} = await sb.from('clients').update({stage:s.moveTo}).eq('stage', s.id); if(error) throw error;
      }
      // Clasificaciones: dos pasos (por si dos nombres se cruzan)
      const cl = D.clasificaciones.filter(c => c.orig && (c.deleted || c.name.trim() !== c.orig));
      for(let i = 0; i < cl.length; i++){
        const {error} = await sb.from('clients').update({clasificacion:'\u0001tmp' + i}).eq('clasificacion', cl[i].orig); if(error) throw error;
      }
      for(let i = 0; i < cl.length; i++){
        const {error} = await sb.from('clients').update({clasificacion: cl[i].deleted ? null : cl[i].name.trim()}).eq('clasificacion', '\u0001tmp' + i); if(error) throw error;
      }
      // Programas (lista dentro de cada cliente)
      const map = {};
      D.programas.filter(p => p.orig).forEach(p => { if(p.deleted) map[p.orig] = null; else if(p.name.trim() !== p.orig) map[p.orig] = p.name.trim(); });
      if(Object.keys(map).length){
        for(let from = 0;; from += 1000){
          const {data, error} = await sb.from('clients').select('id,programas').not('programas', 'is', null).range(from, from + 999); if(error) throw error;
          for(const r of data){
            const cur = Array.isArray(r.programas) ? r.programas : [];
            if(!cur.some(x => has(map, x))) continue;
            const next = [];
            cur.forEach(x => { const m = has(map, x) ? map[x] : x; if(m !== null && !next.includes(m)) next.push(m); });
            const {error: e2} = await sb.from('clients').update({programas:next}).eq('id', r.id); if(e2) throw e2;
          }
          if(data.length < 1000) break;
        }
      }
      const next = {
        appName: D.appName.trim(), subtitle: D.subtitle.trim(), calendlyUrl: D.calendlyUrl.trim(),
        stages: aStages.map(s => ({id:s.id, label:s.label.trim(), hint:s.hint.trim(), color:s.color})),
        programas: D.programas.filter(p => !p.deleted).map(p => p.name.trim()),
        clasificaciones: D.clasificaciones.filter(c => !c.deleted).map(c => c.name.trim()),
        customFields: aCf.map(f => ({id:f.id, label:f.label.trim(), type:f.type, options: f.type === 'list' ? f.options.split(',').map(o => o.trim()).filter(Boolean) : []}))
      };
      const {error} = await sb.from('app_settings').upsert({id:1, data:next, updated_at:new Date().toISOString()}); if(error) throw error;
      CURRENT = next;
      applySettings(next);
      programFilter = programFilter.filter(p => PROGRAMAS.includes(p));
      clasifFilter = clasifFilter.filter(c => CLASIF_FILTER_OPTIONS.includes(c));
      if(activeStage !== 'all' && !STAGE_BY_ID[activeStage]) activeStage = 'all';
      colVisible = {};
      updateProgFilterBtn(); updateClasifFilterBtn();
      window.__reloadClients();
      renderAll();
      closeCfg();
    }catch(err){
      $('cfgSave').disabled = false;
      msg('No se pudo guardar: ' + (err && err.message ? err.message : 'error desconocido'));
    }
  }

  $('settingsBtn').addEventListener('click', () => { draft = mkDraft(); render(); $('settingsOverlay').hidden = false; });
  $('settingsOverlay').addEventListener('click', e => { if(e.target.id === 'settingsOverlay') closeCfg(); });
  if(window.claude) claude.use('user').then(u => { if(u && u.can('data.write')) $('settingsBtn').style.display = ''; });
})();
</script>

</body></html>
